name: MigrantSad
options:
  bundleIdPrefix: com.lahmatov
  developmentLanguage: ru
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic

packages:
  MigrantCore:
    path: Core

targets:
  MigrantSad:
    type: application
    platform: iOS
    # Подпись живёт в отдельном xcconfig, чтобы перегенерация проекта её не стирала.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
        excludes:
          - "Art/**"
          - "Music/**"
      # Картинки карточек — папкой-ссылкой: новый PNG попадает в сборку без xcodegen.
      - path: App/Resources/Art
        type: folder
        buildPhase: resources
      # Записи музыки — тоже папкой-ссылкой: положил файл, собрал, играет.
      - path: App/Resources/Music
        type: folder
        buildPhase: resources
    dependencies:
      - package: MigrantCore
        product: MigrantCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lahmatov.migrantsad
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "23 кг"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Только портрет: игра одной рукой, в очереди в AIMA.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
